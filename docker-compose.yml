services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: agency
      DB_USERNAME: agency
      DB_PASSWORD: 9dc9e23b8b037e739c630ea3b257d07f
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app

  queue:
    build: .
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: agency
      DB_USERNAME: agency
      DB_PASSWORD: 9dc9e23b8b037e739c630ea3b257d07f
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - storage_data:/var/www/html/storage/app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agency
      MYSQL_USER: agency
      MYSQL_PASSWORD: 9dc9e23b8b037e739c630ea3b257d07f
      MYSQL_ROOT_PASSWORD: 9dc9e23b8b037e739c630ea3b257d07f
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p9dc9e23b8b037e739c630ea3b257d07f"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  storage_data:
