name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, tokenizer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        # --legacy-peer-deps: vite 7 vs @vitejs/plugin-vue 5 peer range conflict.
        run: npm ci --legacy-peer-deps

      - name: Build front-end assets
        # Every page renders through @vite(...); without a built
        # public/build/manifest.json (it's gitignored, correctly) the very
        # first request throws ViteManifestNotFoundException and the whole
        # suite fails before a single test runs its own assertions.
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run test suite
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
