# /etc/nginx/sites-available/agency
# ln -s /etc/nginx/sites-available/agency /etc/nginx/sites-enabled/agency
# nginx -t && systemctl reload nginx
# certbot --nginx -d psyber.in -d www.psyber.in   (adds the 443 block + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name psyber.in www.psyber.in;

    root /var/www/agency/public;
    index index.php;
    charset utf-8;

    # Cloudflare real visitor IP (safe to keep even if not proxied)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # deny dotfiles except ACME challenge
    location ~ /\.(?!well-known).* { deny all; }

    # static asset caching
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_log /var/log/nginx/agency-error.log;
    access_log /var/log/nginx/agency-access.log;
}
